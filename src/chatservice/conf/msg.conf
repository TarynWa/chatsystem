# MsgService 运行配置(启动: ./bin/msg_server -i conf/msg.conf)
# 解析器(MprpcConfig)只认 key=value 与整行 # 注释
rpcserverip=127.0.0.1
rpcserverport=8002
zookeeperip=127.0.0.1
zookeeperport=2181
# MySQL(im_message)
mysqlip=localhost
mysqlport=3306
mysqluser=root
mysqlpassword=
mysqldb=im_message
mysqlpool_min=2
mysqlpool_max=8
