# AuthService 运行配置(供 -i 参数), 由 MprpcConfig 解析: 仅整行#注释, key=value
# ---- RPC / zk(mprpc 必需) ----
rpcserverip=127.0.0.1
rpcserverport=8001
zookeeperip=127.0.0.1
zookeeperport=2181

# ---- MySQL(im_auth) ----
mysqlip=localhost
mysqlport=3306
mysqluser=root
mysqlpassword=
mysqldb=im_auth
mysqlpool_min=2
mysqlpool_max=8

# ---- Redis(会话/防爆破) ----
redisip=127.0.0.1
redisport=6379
redisdb=0
redispool_min=1
redispool_max=4

# ---- 会话与安全参数 ----
access_expire_seconds=7200
refresh_expire_days=7
max_devices_per_user=5
device_limit_policy=kick_oldest
brute_force_max_fail=5
brute_force_lock_minutes=30
